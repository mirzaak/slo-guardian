services:
  app:
    build: .
    image: slo-guardian
    environment:
      CHAOS_ENABLED: "true"
    ports: ["8000:8000"]

  loadgen:
    image: slo-guardian
    command: ["python", "loadgen.py", "http://app:8000"]
    depends_on: [app]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
