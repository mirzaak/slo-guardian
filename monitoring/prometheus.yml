global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: member-eligibility
    static_configs:
      - targets: ["app:8000"]

# To send the same metrics to New Relic, uncomment and add your license key:
# remote_write:
#   - url: https://metric-api.newrelic.com/prometheus/v1/write?prometheus_server=slo-guardian
#     authorization:
#       credentials: YOUR_LICENSE_KEY
