# Run with: promtool test rules monitoring/rules_test.yml
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: 10% errors for an hour should page
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+90x120'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="503"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: availability error budget is burning too fast (99.5% SLO)
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md

  - name: 0.1% errors should not page
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+999x120'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="500"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: AvailabilityBudgetBurn
        exp_alerts: []

  - name: 80% slow requests for an hour should page
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="member-eligibility",route="/api/v1/plans",le="0.3"}'
        values: '0+20x120'
      - series: 'http_request_duration_seconds_count{service="member-eligibility",route="/api/v1/plans"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: LatencyBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: latency
            exp_annotations:
              summary: latency error budget is burning too fast (95% SLO)
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md

  - name: 2% slow requests should not page
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="member-eligibility",route="/api/v1/plans",le="0.3"}'
        values: '0+98x120'
      - series: 'http_request_duration_seconds_count{service="member-eligibility",route="/api/v1/plans"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: LatencyBudgetBurn
        exp_alerts: []

  - name: service down
    interval: 1m
    input_series:
      - series: 'up{job="member-eligibility",instance="app:8000"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: member-eligibility
              instance: app:8000
            exp_annotations:
              summary: Prometheus can't scrape the service
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md

  - name: 4% errors for 6h should page via the slow-burn window
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+96x420'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="503"}'
        values: '0+4x420'
    alert_rule_test:
      - eval_time: 370m
        alertname: AvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: availability error budget is burning too fast (99.5% SLO)
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md

  - name: 2% errors for 6h should not page
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+98x420'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="503"}'
        values: '0+2x420'
    alert_rule_test:
      - eval_time: 370m
        alertname: AvailabilityBudgetBurn
        exp_alerts: []

  - name: 2% errors for a day should open a ticket
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+98x1600'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="503"}'
        values: '0+2x1600'
    alert_rule_test:
      - eval_time: 1560m
        alertname: AvailabilityBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: availability
            exp_annotations:
              summary: availability error budget is burning slowly but steadily (99.5% SLO)
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
      - eval_time: 1560m
        alertname: AvailabilityBudgetBurn
        exp_alerts: []

  - name: 1% errors for a day should not open a ticket
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="200"}'
        values: '0+99x1600'
      - series: 'http_requests_total{service="member-eligibility",route="/api/v1/plans",status="503"}'
        values: '0+1x1600'
    alert_rule_test:
      - eval_time: 1560m
        alertname: AvailabilityBudgetSlowBurn
        exp_alerts: []

  - name: 20% slow requests for a day should open a ticket
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="member-eligibility",route="/api/v1/plans",le="0.3"}'
        values: '0+80x1600'
      - series: 'http_request_duration_seconds_count{service="member-eligibility",route="/api/v1/plans"}'
        values: '0+100x1600'
    alert_rule_test:
      - eval_time: 1560m
        alertname: LatencyBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: latency
            exp_annotations:
              summary: latency error budget is burning slowly but steadily (95% SLO)
              runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
      - eval_time: 1560m
        alertname: LatencyBudgetBurn
        exp_alerts: []

  - name: 10% slow requests for a day should not open a ticket
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="member-eligibility",route="/api/v1/plans",le="0.3"}'
        values: '0+90x1600'
      - series: 'http_request_duration_seconds_count{service="member-eligibility",route="/api/v1/plans"}'
        values: '0+100x1600'
    alert_rule_test:
      - eval_time: 1560m
        alertname: LatencyBudgetSlowBurn
        exp_alerts: []
