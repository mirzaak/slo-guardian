# Error ratio = bad requests / all requests, over different time windows.
# Alerts use the multi-window burn rate approach from the Google SRE Workbook:
# page when the error budget burns 14.4x too fast over 1h (and still in the last 5m),
# or 6x too fast over 6h (and still in the last 30m).
# A slower burn (3x over 1d, still in the last 2h) opens a ticket instead of paging.
groups:
  - name: slo-recording
    rules:
      - record: slo:error_ratio:rate5m
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[5m]))
      - record: slo:error_ratio:rate30m
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[30m])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[30m]))
      - record: slo:error_ratio:rate1h
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[1h])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[1h]))
      - record: slo:error_ratio:rate6h
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[6h])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[6h]))
      - record: slo:error_ratio:rate2h
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[2h])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[2h]))
      - record: slo:error_ratio:rate1d
        labels:
          slo: availability
        expr: (sum(rate(http_requests_total{service="member-eligibility",status=~"5.."}[1d])) or vector(0)) / sum(rate(http_requests_total{service="member-eligibility"}[1d]))
      - record: slo:error_ratio:rate5m
        labels:
          slo: latency
        expr: 1 - sum(rate(http_request_duration_seconds_bucket{service="member-eligibility",le="0.3"}[5m])) / sum(rate(http_request_duration_seconds_count{service="member-eligibility"}[5m]))
      - record: slo:error_ratio:rate30m
        labels:
          slo: latency
        expr: 1 - sum(rate(http_request_duration_seconds_bucket{service="member-eligibility",le="0.3"}[30m])) / sum(rate(http_request_duration_seconds_count{service="member-eligibility"}[30m]))
      - record: slo:error_ratio:rate1h
        labels:
          slo: latency
        expr: 1 - sum(rate(http_request_duration_seconds_bucket{service="member-eligibility",le="0.3"}[1h])) / sum(rate(http_request_duration_seconds_count{service="member-eligibility"}[1h]))
      - record: slo:error_ratio:rate6h
        labels:
          slo: latency
        expr: 1 - sum(rate(http_request_duration_seconds_bucket{service="member-eligibility",le="0.3"}[6h])) / sum(rate(http_request_duration_seconds_count{service="member-eligibility"}[6h]))

  - name: slo-alerts
    rules:
      - alert: AvailabilityBudgetBurn
        expr: |
          (slo:error_ratio:rate1h{slo="availability"} > 14.4 * 0.005 and slo:error_ratio:rate5m{slo="availability"} > 14.4 * 0.005)
          or
          (slo:error_ratio:rate6h{slo="availability"} > 6 * 0.005 and slo:error_ratio:rate30m{slo="availability"} > 6 * 0.005)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: availability error budget is burning too fast (99.5% SLO)
          runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
      - alert: AvailabilityBudgetSlowBurn
        expr: |
          slo:error_ratio:rate1d{slo="availability"} > 3 * 0.005 and slo:error_ratio:rate2h{slo="availability"} > 3 * 0.005
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: availability error budget is burning slowly but steadily (99.5% SLO)
          runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
      - alert: LatencyBudgetBurn
        expr: |
          (slo:error_ratio:rate1h{slo="latency"} > 14.4 * 0.05 and slo:error_ratio:rate5m{slo="latency"} > 14.4 * 0.05)
          or
          (slo:error_ratio:rate6h{slo="latency"} > 6 * 0.05 and slo:error_ratio:rate30m{slo="latency"} > 6 * 0.05)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: latency error budget is burning too fast (95% SLO)
          runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
      - alert: ServiceDown
        expr: up{job="member-eligibility"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Prometheus can't scrape the service
          runbook: https://github.com/mirzaak/slo-guardian/blob/main/docs/runbook.md
